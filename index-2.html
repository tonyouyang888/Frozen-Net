<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unfrozen Net - 活动接龙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --ice: #e0f4ff;
            --frost: #b8e3f8;
            --deep: #0a1628;
            --blue: #1a8fe3;
            --cyan: #00c6ff;
            --accent: #ff6b35;
            --green: #00d084;
            --amber: #ffb830;
            --purple: #a78bfa;
            --glass: rgba(255,255,255,0.07);
            --glass-border: rgba(255,255,255,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--deep);
            min-height: 100vh;
            color: #e8f4fd;
            overflow-x: hidden;
        }

        /* Animated ice background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0,198,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 80%, rgba(26,143,227,0.1) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(0,198,255,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Floating ice crystals */
        .crystals {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .crystal {
            position: absolute;
            color: rgba(0,198,255,0.2);
            font-size: 1.2rem;
            animation: floatCrystal linear infinite;
        }

        @keyframes floatCrystal {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeDown 0.7s ease both;
        }
        .header h1 {
            font-family: 'Sora', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, var(--cyan) 50%, var(--blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .header p {
            color: rgba(200,230,255,0.6);
            font-size: 0.95rem;
            font-weight: 300;
        }
        .header .snowflake {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 12px rgba(0,198,255,0.6));
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Stats Grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            animation: fadeUp 0.6s 0.1s ease both;
        }
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1.1rem 0.75rem;
            text-align: center;
            backdrop-filter: blur(12px);
            transition: transform 0.25s, border-color 0.25s;
        }
        .stat-card:hover { transform: translateY(-3px); border-color: rgba(0,198,255,0.3); }
        .stat-card .emoji { font-size: 1.4rem; margin-bottom: 0.3rem; }
        .stat-card .label { font-size: 0.7rem; color: rgba(200,230,255,0.5); margin-bottom: 0.2rem; }
        .stat-card .value {
            font-family: 'Sora', sans-serif;
            font-size: 1.9rem;
            font-weight: 700;
            line-height: 1;
        }
        .value-blue { color: var(--cyan); }
        .value-green { color: var(--green); }
        .value-amber { color: var(--amber); }
        .value-purple { color: var(--purple); }

        /* Progress Bar */
        .progress-wrap {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1.1rem 1.25rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(12px);
            animation: fadeUp 0.6s 0.15s ease both;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: rgba(200,230,255,0.6);
            margin-bottom: 0.6rem;
        }
        .progress-bar-bg {
            background: rgba(255,255,255,0.08);
            border-radius: 99px;
            height: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(0,198,255,0.5);
        }

        /* Buttons */
        .btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            animation: fadeUp 0.6s 0.2s ease both;
        }
        .btn {
            border: none;
            border-radius: 0.9rem;
            padding: 1rem;
            font-size: 1rem;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,198,255,0.3);
        }
        .btn-primary:hover { box-shadow: 0 6px 28px rgba(0,198,255,0.5); transform: translateY(-1px); }
        .btn-amber {
            background: linear-gradient(135deg, #e67e22, var(--amber));
            color: #fff;
            box-shadow: 0 4px 20px rgba(255,184,48,0.25);
        }
        .btn-amber:hover { box-shadow: 0 6px 28px rgba(255,184,48,0.4); transform: translateY(-1px); }

        /* Participant List */
        .list-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            margin-bottom: 1.5rem;
            animation: fadeUp 0.6s 0.25s ease both;
        }
        .list-title {
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: rgba(200,230,255,0.9);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .participant-list { display: flex; flex-direction: column; gap: 0.6rem; min-height: 80px; }

        .p-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid transparent;
            transition: all 0.2s;
            animation: slideIn 0.3s ease both;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .p-item.signed { background: rgba(0,208,132,0.08); border-color: rgba(0,208,132,0.2); }
        .p-item.waitlist { background: rgba(255,184,48,0.08); border-color: rgba(255,184,48,0.2); }
        .p-left { display: flex; align-items: center; gap: 0.6rem; }
        .p-num {
            font-family: 'Sora', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(200,230,255,0.4);
            width: 1.2rem;
        }
        .p-name { font-size: 0.9rem; font-weight: 500; color: #e0f0ff; }
        .p-right { display: flex; align-items: center; gap: 0.4rem; }

        .tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.55rem;
            border-radius: 99px;
            border: none;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tag-paid { background: rgba(167,139,250,0.2); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }
        .tag-paid:hover { background: rgba(167,139,250,0.35); }
        .tag-unpaid { background: rgba(255,255,255,0.08); color: rgba(200,230,255,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .tag-unpaid:hover { background: rgba(255,255,255,0.14); }
        .del-btn {
            background: none;
            border: none;
            color: rgba(255,100,100,0.5);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0.2rem;
            transition: color 0.2s;
        }
        .del-btn:hover { color: rgba(255,80,80,0.9); }

        .empty-hint {
            text-align: center;
            color: rgba(200,230,255,0.3);
            font-size: 0.85rem;
            padding: 1.5rem 0;
        }

        /* Copy Button */
        .copy-btn {
            width: 100%;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(200,230,255,0.8);
            border-radius: 0.9rem;
            padding: 0.9rem;
            font-size: 0.9rem;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            animation: fadeUp 0.6s 0.3s ease both;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(0,198,255,0.3); color: #fff; }

        /* Admin modal */
        .modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-bg.open { display: flex; }
        .modal {
            background: #0d1f35;
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            padding: 1.75rem;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .modal h3 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #e0f0ff;
        }
        .modal input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0.6rem;
            padding: 0.75rem 1rem;
            color: #e0f0ff;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 1rem;
        }
        .modal input:focus { border-color: var(--cyan); }
        .modal-btns { display: flex; gap: 0.6rem; }
        .modal-btns button {
            flex: 1;
            padding: 0.65rem;
            border-radius: 0.6rem;
            border: none;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .modal-confirm { background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #fff; }
        .modal-cancel { background: rgba(255,255,255,0.08); color: rgba(200,230,255,0.7); }

        /* Admin config */
        .admin-area {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            margin-bottom: 1.5rem;
            animation: fadeUp 0.6s 0.3s ease both;
        }
        .admin-title { font-size: 0.8rem; color: rgba(200,230,255,0.5); margin-bottom: 0.8rem; }
        .admin-row { display: flex; align-items: center; gap: 0.6rem; }
        .admin-row label { font-size: 0.85rem; color: rgba(200,230,255,0.7); white-space: nowrap; }
        .admin-row input {
            width: 70px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0.5rem;
            padding: 0.4rem 0.6rem;
            color: #e0f0ff;
            font-size: 0.9rem;
            font-family: 'Sora', sans-serif;
            outline: none;
            text-align: center;
        }
        .admin-row input:focus { border-color: var(--cyan); }
        .admin-save {
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            border: none;
            border-radius: 0.5rem;
            color: #fff;
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 600;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0,208,132,0.15);
            border: 1px solid rgba(0,208,132,0.4);
            color: var(--green);
            padding: 0.6rem 1.2rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 200;
            backdrop-filter: blur(8px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<!-- Floating crystals -->
<div class="crystals" id="crystals"></div>

<div class="wrap">
    <div class="header">
        <span class="snowflake">❄️</span>
        <h1>Unfrozen Net 活动接龙</h1>
        <div id="activity-time-display" style="margin-top:0.6rem;display:inline-block;background:rgba(0,198,255,0.1);border:1px solid rgba(0,198,255,0.3);border-radius:99px;padding:0.35rem 1.1rem;font-size:0.88rem;color:var(--cyan);font-weight:500">
            📅 <span id="activity-time-text">待设置活动时间</span>
        </div>
        <p style="margin-top:0.5rem">欢迎加入，快来报名一起玩吧 🎾</p>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-card">
            <div class="emoji">🎟️</div>
            <div class="label">总名额</div>
            <div class="value value-blue" id="total-slots">—</div>
        </div>
        <div class="stat-card">
            <div class="emoji">✅</div>
            <div class="label">已报名</div>
            <div class="value value-green" id="signed-up">0</div>
        </div>
        <div class="stat-card">
            <div class="emoji">⏳</div>
            <div class="label">Waitlist</div>
            <div class="value value-amber" id="waitlist">0</div>
        </div>
        <div class="stat-card">
            <div class="emoji">💰</div>
            <div class="label">已付款</div>
            <div class="value value-purple" id="paid">0</div>
        </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
        <div class="progress-label">
            <span>报名进度</span>
            <span id="progress-text">0 / 0</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
    </div>

    <!-- Buttons -->
    <div class="btns">
        <button class="btn btn-primary" onclick="openModal('signed')">🚀 我要报名</button>
        <button class="btn btn-amber" onclick="openModal('waitlist')">⏳ 加入 Waitlist</button>
    </div>

    <!-- Participant List -->
    <div class="list-card">
        <div class="list-title">📋 报名列表</div>
        <div class="participant-list" id="participant-list">
            <div class="empty-hint">暂无报名，快来第一个！</div>
        </div>
    </div>

    <!-- Admin: set slots -->
    <div class="admin-area">
        <div class="admin-title">⚙️ 管理员设置</div>
        <div class="admin-row">
            <label>总名额</label>
            <input type="number" id="slots-input" min="1" value="20">
            <button class="admin-save" onclick="saveSlots()">保存</button>
        </div>
        <div class="admin-row" style="margin-top:0.75rem">
            <label>活动时间</label>
            <input type="text" id="time-input" placeholder="如 06/10 周六 9-11AM" style="width:auto;flex:1;text-align:left">
            <button class="admin-save" onclick="saveTime()">保存</button>
        </div>
        <div class="admin-row" style="margin-top:0.75rem">
            <label>清空报名</label>
            <button class="admin-save" style="background:linear-gradient(135deg,#c0392b,#e74c3c);margin-left:0" onclick="resetAll()">🗑️ 全部清零</button>
        </div>
    </div>

    <!-- Copy + Download -->
    <div style="display:flex;gap:0.75rem;margin-top:0">
        <button class="copy-btn" style="flex:1" onclick="copySummary()">
            <i class="fa-solid fa-copy"></i> 复制接龙文本
        </button>
        <button class="copy-btn" style="flex:1;border-color:rgba(0,208,132,0.3);color:var(--green)" onclick="downloadCSV()">
            <i class="fa-solid fa-download"></i> 下载名单
        </button>
    </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal">
    <div class="modal">
        <h3 id="modal-title">报名</h3>
        <input type="text" id="modal-input" placeholder="请输入你的名字（可加备注）" maxlength="40">
        <div class="modal-btns">
            <button class="modal-cancel" onclick="closeModal()">取消</button>
            <button class="modal-confirm" onclick="confirmModal()">确认 ✓</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // ── State ──────────────────────────────────────────────
    let participants = JSON.parse(localStorage.getItem('fn_participants') || '[]');
    let totalSlots = parseInt(localStorage.getItem('fn_slots') || '20', 10);
    let activityTime = localStorage.getItem('fn_time') || '';
    let pendingStatus = 'signed';

    // ── Crystals ──────────────────────────────────────────
    (function spawnCrystals() {
        const container = document.getElementById('crystals');
        const symbols = ['❄', '✦', '✧', '⋆', '·'];
        for (let i = 0; i < 18; i++) {
            const el = document.createElement('span');
            el.className = 'crystal';
            el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (12 + Math.random() * 16) + 's';
            el.style.animationDelay = (Math.random() * 14) + 's';
            el.style.fontSize = (0.7 + Math.random() * 1.2) + 'rem';
            container.appendChild(el);
        }
    })();

    // ── Modal ──────────────────────────────────────────────
    function openModal(status) {
        pendingStatus = status;
        document.getElementById('modal-title').textContent =
            status === 'signed' ? '🚀 报名参加' : '⏳ 加入 Waitlist';
        document.getElementById('modal-input').value = '';
        document.getElementById('modal').classList.add('open');
        setTimeout(() => document.getElementById('modal-input').focus(), 100);
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('open');
    }

    function confirmModal() {
        const name = document.getElementById('modal-input').value.trim();
        if (!name) { showToast('请输入名字 😊'); return; }
        const now = new Date();
        const timeStr = now.getMonth()+1 + '/' + now.getDate() + ' ' +
            String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        participants.push({ name, status: pendingStatus, paid: false, time: timeStr });
        save();
        closeModal();
        updateUI();
        showToast(pendingStatus === 'signed' ? '✅ 报名成功！' : '⏳ 已加入 Waitlist！');
    }

    // Enter key in modal
    document.getElementById('modal-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') confirmModal();
        if (e.key === 'Escape') closeModal();
    });
    document.getElementById('modal').addEventListener('click', e => {
        if (e.target === document.getElementById('modal')) closeModal();
    });

    // ── Slots ──────────────────────────────────────────────
    function saveSlots() {
        const v = parseInt(document.getElementById('slots-input').value, 10);
        if (isNaN(v) || v < 1) { showToast('请输入有效名额'); return; }
        totalSlots = v;
        save();
        updateUI();
        showToast('✓ 名额已更新');
    }

    function saveTime() {
        const t = document.getElementById('time-input').value.trim();
        if (!t) { showToast('请输入活动时间'); return; }
        activityTime = t;
        save();
        updateTimeDisplay();
        showToast('✓ 活动时间已更新');
    }

    function updateTimeDisplay() {
        document.getElementById('activity-time-text').textContent = activityTime || '待设置活动时间';
        const el = document.getElementById('time-input');
        if (el) el.value = activityTime;
    }

    // ── Persistence ────────────────────────────────────────
    function save() {
        localStorage.setItem('fn_participants', JSON.stringify(participants));
        localStorage.setItem('fn_slots', String(totalSlots));
        localStorage.setItem('fn_time', activityTime);
    }

    // ── UI ─────────────────────────────────────────────────
    function updateUI() {
        const signed = participants.filter(p => p.status === 'signed').length;
        const wait = participants.filter(p => p.status === 'waitlist').length;
        const paid = participants.filter(p => p.paid).length;

        document.getElementById('total-slots').textContent = totalSlots;
        document.getElementById('signed-up').textContent = signed;
        document.getElementById('waitlist').textContent = wait;
        document.getElementById('paid').textContent = paid;
        document.getElementById('slots-input').value = totalSlots;

        const pct = totalSlots > 0 ? Math.min(100, Math.round(signed / totalSlots * 100)) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-text').textContent = `${signed} / ${totalSlots}`;

        const list = document.getElementById('participant-list');
        if (participants.length === 0) {
            list.innerHTML = '<div class="empty-hint">暂无报名，快来第一个！</div>';
            return;
        }

        list.innerHTML = '';
        participants.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `p-item ${p.status}`;
            div.style.animationDelay = (i * 0.04) + 's';
            div.innerHTML = `
                <div class="p-left">
                    <span class="p-num">${i + 1}</span>
                    <span style="font-size:1rem">${p.status === 'signed' ? '✅' : '⏳'}</span>
                    <div>
                        <div class="p-name">${escHtml(p.name)}</div>
                        ${p.time ? `<div style="font-size:0.65rem;color:rgba(200,230,255,0.4);margin-top:1px">${p.time}</div>` : ''}
                    </div>
                </div>
                <div class="p-right">
                    <button class="tag ${p.paid ? 'tag-paid' : 'tag-unpaid'}" onclick="togglePaid(${i})">
                        ${p.paid ? '已付款' : '未付'}
                    </button>
                    <button class="del-btn" onclick="removePerson(${i})" title="删除">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function togglePaid(i) {
        participants[i].paid = !participants[i].paid;
        save();
        updateUI();
    }

    function removePerson(i) {
        if (!confirm(`确定删除「${participants[i].name}」？`)) return;
        participants.splice(i, 1);
        save();
        updateUI();
        showToast('已删除');
    }

    // ── Copy ───────────────────────────────────────────────
    function copySummary() {
        const signed = participants.filter(p => p.status === 'signed');
        const wait = participants.filter(p => p.status === 'waitlist');
        let text = `🎾 Unfrozen Net 活动接龙\n`;
        text += `${'─'.repeat(24)}\n`;
        text += `🎟️ 名额：${totalSlots}  ✅ 已报名：${signed.length}  ⏳ Waitlist：${wait.length}\n\n`;

        if (signed.length > 0) {
            text += `【已报名】\n`;
            signed.forEach((p, i) => {
                text += `${i + 1}. ${p.name}${p.paid ? ' ✓已付' : ''}\n`;
            });
        }
        if (wait.length > 0) {
            text += `\n【Waitlist】\n`;
            wait.forEach((p, i) => {
                text += `${i + 1}. ${p.name}\n`;
            });
        }
        text += `\n🎾 Unfrozen Net 期待你的参与！`;

        navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板！'));
    }

    // ── Toast ──────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function resetAll() {
        if (!confirm('确定清空所有报名记录？此操作不可撤销！')) return;
        participants = [];
        save();
        updateUI();
        showToast('🗑️ 已清空所有报名');
    }

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Download ───────────────────────────────────────────
    function downloadCSV() {
        let rows = [['序号','姓名','状态','付款','报名时间']];
        participants.forEach((p, i) => {
            rows.push([
                i + 1,
                p.name,
                p.status === 'signed' ? '已报名' : 'Waitlist',
                p.paid ? '已付' : '未付',
                p.time || ''
            ]);
        });
        const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
        const bom = '\uFEFF'; // UTF-8 BOM for Excel
        const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Unfrozen-Net-报名名单.csv';
        a.click();
        URL.revokeObjectURL(url);
        showToast('✅ 名单已下载！');
    }

    // ── Init ───────────────────────────────────────────────
    updateUI();
    updateTimeDisplay();
</script>
</body>
</html>
